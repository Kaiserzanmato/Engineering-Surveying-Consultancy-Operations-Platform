name: CI

# Security/CI pipeline per TECHNICAL_ARCHITECTURE.md §21 and AGENTS.md Phase M.
# Per AGENTS.md §3 ("do not create fake integrations"), this workflow only
# runs checks that currently do something real. The `test` job runs the
# full `bun run test` suite via vitest, which as of 2026-08-11 covers both
# layers described in TESTING.md: pure-function unit tests AND real-
# database RBAC integration tests (PGlite — ephemeral, in-memory, no
# external DB/network dependency, so no extra CI provisioning was needed
# to add this layer). Security/accessibility/browser-smoke jobs are still
# not set up — add each category's job in the same change that introduces
# the first tests it actually covers.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-verify:
    name: Install / lockfile verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install-and-verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    needs: install-and-verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate Next.js route types
        run: bunx next typegen
      - run: bunx tsc --noEmit

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    needs: install-and-verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: install-and-verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: bun audit
        run: bun audit --audit-level=high
